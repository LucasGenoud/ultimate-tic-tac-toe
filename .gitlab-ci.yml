image: golang:1.25

stages:
  - test
  - build

test:
  stage: test
  script:
    - make test

build_linux:
  stage: build
  before_script:
    - apt-get update -y
    # Courtesy of Fanny Castella for the list of build dependencies
    - apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libxxf86vm-dev
  script:
    - GOOS=linux GOARCH=amd64 go build -o main_linux ./cmd/main
  artifacts:
    paths:
      - main_linux

build_windows:
  stage: build
  script:
    - GOOS=windows GOARCH=amd64 go build -o main_windows.exe ./cmd/main
  artifacts:
    paths:
      - main_windows.exe

build_web:
  stage: build
  script:
    - make web
  artifacts:
    paths:
      - dist/
